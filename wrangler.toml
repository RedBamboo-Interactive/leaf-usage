name = "leaf-usage"
main = "src/index.ts"
compatibility_date = "2026-10-24"
workers_dev = false
preview_urls = false
logpush = false
routes = [
  { pattern = "usage.minititine.cc", custom_domain = true }
]

# Resource ids are filled by scripts/provision.ps1 before the first deployment.
[[d1_databases]]
binding = "USAGE_DB"
database_name = "leaf-usage"
database_id = "ebccb94a-5546-4736-b671-09818d1df5ec"
migrations_dir = "migrations"

# Keyed on cf-connecting-ip inside the binding only; the address is never stored.
[[ratelimits]]
name = "REGISTER_RATE_LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "2002"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["23 3 * * *"]

# No request logs are kept or exported, at any sampling rate: invocation logs can carry request
# metadata, and the privacy notice promises the address is not stored. `wrangler tail` still works
# for live debugging and persists nothing.
[observability]
enabled = false
